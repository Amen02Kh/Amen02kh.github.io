# ─────────────────────────────────────────────
#  Site
# ─────────────────────────────────────────────
title: K-HA$H
description: Writeups, cheat sheets and certifications from a junior penetration tester.
url: "https://amen02kh.github.io"
baseurl: ""
lang: en

# Writeups live at /writeups/<file-name>/
permalink: /writeups/:title/

# ─────────────────────────────────────────────
#  You
# ─────────────────────────────────────────────
author:
  name: Amen Allah Khalfallah
  alias: K-HA$H
  email: khamen.02@gmail.com
  tagline: Junior penetration tester, reverse engineering enjoyer and gym rat.
  photo: "/assets/boruto.jpg"                       # e.g. /assets/me.jpg  (leave empty for a placeholder)
  photo_caption: "last seen: on a shell"
  github: https://github.com/Amen02kh
  linkedin: https://www.linkedin.com/in/amen-allah-khalfallah/

# Your CV. Either drop the PDF at `path`, or paste a link (Google Drive, etc.) into `url`.
# The CV buttons (menu, home, rap sheet, contact) appear as soon as one of them is set.
cv:
  path: /assets/cv.pdf
  url: ""                         # optional external link, used instead of the file
  updated: ""                     # e.g. "Nov 2026"

# Contact form: create a free form at https://formspree.io and paste its id (the part after /f/).
# Leave empty and the form falls back to opening the visitor's email app.
contact:
  formspree_id: ""
  response_time: "a couple of days"

# ─────────────────────────────────────────────
#  Theme
# ─────────────────────────────────────────────
# Handwriting font for the chalk text. Any of:
# "Covered By Your Grace", "Rock Salt", "Permanent Marker", "Reenie Beanie", "Gochi Hand"
hand_font: "Covered By Your Grace"

# Left side of the footer on every page
footer_text: "Wanted for breaking things to learn how they work."

# ─────────────────────────────────────────────
#  Feature switches
# ─────────────────────────────────────────────
# Set any of these to false to switch that part of the site off.
# It disappears from the menu, the city map and every link to it,
# and its pages show a "closed for now" notice instead (hidden from search engines).
features:
  cheatsheets: false
  contact: true
  city_map: true
  pink_slips: true
  pursuit_log: true
  cv: true
  graffiti: true          # faded spray paint on the wall
  page_transitions: true  # slide between pages like the game menu (false = instant)

# Game-style main menu, in order. Left/right arrow keys (or the arrow buttons)
# move through it like the game. `icon`: car, flag, wrench, slip, badge, radio.
# `feature` ties an item to a switch above.
nav:
  - title: Garage
    url: /
    icon: car
  - title: Pursuit log
    url: /archive/
    icon: flag
    feature: pursuit_log
  - title: Cheat sheets
    url: /cheatsheets/
    icon: wrench
    feature: cheatsheets
  - title: Rap sheet
    url: /about/
    icon: badge
  - title: Contact
    url: /contact/
    icon: radio
    feature: contact

# Title above the menu, in blackletter
menu_title: main menu

# ─────────────────────────────────────────────
#  Collections and defaults
# ─────────────────────────────────────────────
collections:
  cheatsheets:
    output: true
    permalink: /cheatsheets/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: cheatsheets }
    values: { layout: cheatsheet, feature: cheatsheets }
  - scope: { path: "" }
    values: { layout: page }

# ─────────────────────────────────────────────
#  Build
# ─────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: false

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - .editorconfig
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts
  - vendor
