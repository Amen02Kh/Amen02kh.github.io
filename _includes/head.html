<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1a201b">

  {% seo %}
  {%- if page.feature and site.features[page.feature] == false %}
  <meta name="robots" content="noindex">
  {%- endif %}

  {%- if page.layout == "post" -%}
    {%- assign card = "/assets/cards/" | append: page.slug | append: ".jpg" -%}
  {%- else -%}
    {%- assign card = "/assets/cards/default.jpg" -%}
  {%- endif %}
  <meta property="og:image" content="{{ card | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ card | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{ site.hand_font | default: 'Covered By Your Grace' | replace: ' ', '+' }}&family=Pirata+One&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>:root{--hand:"{{ site.hand_font | default: 'Covered By Your Grace' }}", "Comic Sans MS", cursive;--graffiti:{{ site.graffiti_strength | default: 0.16 }};}</style>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <link rel="apple-touch-icon" sizes="144x144" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | relative_url }}">

  <script>
    /* Runs before first paint: tells the page-switch animation which way to slide. */
    (function () {
      var K = "khash-nav-dir";
      function apply(e) {
        if (!e.viewTransition || !e.viewTransition.types) return;
        var d = "forward"; try { d = sessionStorage.getItem(K) || "forward"; } catch (x) {}
        e.viewTransition.types.add(d);
      }
      addEventListener("pageswap", apply);
      addEventListener("pagereveal", function (e) { apply(e); try { sessionStorage.removeItem(K); } catch (x) {} });
    })();
  </script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
